# GitHub Pages via GitHub Actions (deploy-pages@v5)
#
# WICHTIG gegen den "Getting Pages deployment status..."-Dauerschleife:
#  1. Pages-Quelle des Repos muss "GitHub Actions" sein
#     (Settings → Pages → Build and deployment → Source), sonst wird das
#     erstellte Deployment nie abgearbeitet und der Status bleibt leer.
#     -> configure-pages mit enablement: true macht das automatisch
#        (braucht pages: write).
#  2. permissions pages:write + id-token:write (OIDC) müssen gesetzt sein.
#  3. timeout-minutes begrenzt den Job, damit er nicht ewig pollt.
#
# Branch-Namen unter on.push anpassen (z. B. mobile-first, main, master).
# upload path anpassen, falls nicht das ganze Repo deployed werden soll.

name: Deploy Pages

on:
  push:
    branches: [ "main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages (aktiviert Pages + Quelle "GitHub Actions")
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # Beim alten "Deploy from a branch" hat Jekyll README.md automatisch
      # als index.html gerendert. Beim Actions-Deploy gibt es keinen
      # automatischen Build -> README.md vor dem Upload nach index.html rendern,
      # sonst findet Pages im Root keine index.html (404).
      # Statt pandoc via apt (29 MB Paket + 207 MB Deps, langsam) rendern wir
      # ueber die GitHub Markdown API: rendert GFM exakt wie die README-Ansicht
      # auf github.com. jq und curl sind auf ubuntu-latest vorinstalliert.
      # Antwort von POST /markdown ist fertiges HTML (kein JSON-Wrapper).
      - name: README.md als index.html rendern (GitHub Markdown API)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          jq -Rs '{text: ., mode: "gfm"}' README.md > /tmp/payload.json
          curl -sfL -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/markdown \
            --data @/tmp/payload.json > /tmp/body.html
          {
            printf '<!doctype html>\n<html lang="de">\n<head>\n<meta charset="utf-8">\n'
            printf '<meta name="viewport" content="width=device-width, initial-scale=1">\n'
            printf '<title>KMA RevealJS Slides</title>\n'
            printf '<link rel="stylesheet" href="build/fonts/fonts.css">\n'
            printf '<link rel="stylesheet" href="pages.css">\n'
            printf '</head>\n<body>\n'
            cat /tmp/body.html
            printf '\n</body>\n</html>\n'
          } > index.html

      - name: Upload Pages-Artefakt
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."            # ggf. anpassen, z. B. path: "2026_11_KMA"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
